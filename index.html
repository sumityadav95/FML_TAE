{% extends "base.html" %}
{% block content %}
<section class="hero">
  <div class="eyebrow">MODEL WORKBENCH / 01</div>
  <h1>Optimize your<br><span>classification model.</span></h1>
  <p class="subtext">Upload a dataset, configure your experiment and compare model performance.</p>
</section>
<section class="panel upload-panel">
  <div class="section-heading"><div><span class="step">01</span><h2>Upload dataset</h2></div><span class="muted">CSV FORMAT · MAX 16 MB</span></div>
  <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
    <label class="dropzone" for="dataset">
      <span class="upload-icon">↑</span>
      <strong>Choose a CSV file</strong>
      <span id="file-name">or drag and drop it here</span>
      <input id="dataset" name="dataset" type="file" accept=".csv,text/csv" required>
    </label>
    <button class="primary" type="submit">Upload dataset <span>→</span></button>
  </form>
</section>
{% endblock %}
{% block extra %}{% endblock %}
